name = "daycare-attendance-staging"
main = "src/index.ts"
compatibility_date = "2026-11-16"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/downloads/*"]

[[d1_databases]]
binding = "DB"
database_name = "daycare-attendance-staging"
# Local-only placeholder. Replace with a database created in the provider's account before any remote use.
database_id = "e772592e-7a88-4e0e-b849-3c6286efd33a"
migrations_dir = "migrations"
