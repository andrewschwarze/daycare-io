name = "daycare-io-staging"
main = "src/index.ts"
compatibility_date = "2026-11-16"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/downloads/*"]

[[d1_databases]]
binding = "DB"
database_name = "daycare-io-staging"
# Local-only placeholder. Replace with a database created in the provider's account before any remote use.
database_id = "4e05217d-24da-4b6e-8226-71b2c465df23"
migrations_dir = "migrations"
